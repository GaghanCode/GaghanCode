<svg viewBox="0 0 460 235" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tb1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#61AFEF"/><stop offset="100%" stop-color="#98C379"/>
    </linearGradient>
    <linearGradient id="tb2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#98C379"/><stop offset="100%" stop-color="#E5C07B"/>
    </linearGradient>
    <linearGradient id="tb3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C678DD"/><stop offset="100%" stop-color="#61AFEF"/>
    </linearGradient>
  </defs>

  <rect x="10" y="10" width="440" height="215" rx="10" fill="#0D1117"/>
  <rect x="10" y="10" width="440" height="215" rx="10" fill="none" stroke="#30363D" stroke-width="1.5"/>

  <text x="22" y="36" fill="#E5C07B" font-family="Consolas, monospace" font-size="14" font-weight="bold">WHAT DRIVES ME</text>

  <text x="22" y="68" fill="#8B949E" font-family="Consolas, monospace" font-size="12">Clean Code</text>
  <rect x="22" y="75" width="330" height="8" rx="4" fill="#21262D"/>
  <rect x="22" y="75" width="0" height="8" rx="4" fill="url(#tb1)">
    <animate attributeName="width" from="0" to="313" dur="1.2s" begin="0.2s" fill="freeze"/>
  </rect>

  <text x="22" y="102" fill="#8B949E" font-family="Consolas, monospace" font-size="12">Performance</text>
  <rect x="22" y="109" width="330" height="8" rx="4" fill="#21262D"/>
  <rect x="22" y="109" width="0" height="8" rx="4" fill="url(#tb1)">
    <animate attributeName="width" from="0" to="297" dur="1.2s" begin="0.5s" fill="freeze"/>
  </rect>

  <text x="22" y="136" fill="#8B949E" font-family="Consolas, monospace" font-size="12">Scalability</text>
  <rect x="22" y="143" width="330" height="8" rx="4" fill="#21262D"/>
