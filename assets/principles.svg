  <rect x="22" y="177" width="0" height="8" rx="4" fill="url(#tb3)">
    <animate attributeName="width" from="0" to="289" dur="1.2s" begin="1.1s" fill="freeze"/>
  </rect>

  <text x="22" y="204" fill="#8B949E" font-family="Consolas, monospace" font-size="12">Continuous Learning</text>
  <rect x="22" y="211" width="330" height="8" rx="4" fill="#21262D"/>
  <rect x="22" y="211" width="0" height="8" rx="4" fill="url(#tb2)">
